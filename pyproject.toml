[project]
name = "alphamesh"
version = "0.1.0"
description = "AlphaMesh - autonomous AI options trading agent on Alpaca paper trading"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "PyYAML>=6.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "alpaca-py>=0.33",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.36", "pandas>=2.2"]
dev = ["pytest>=8.2", "pytest-cov>=5.0", "ruff>=0.5", "mypy>=1.10", "types-PyYAML"]

[project.scripts]
alphamesh = "alphamesh.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["alphamesh"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning:alphamesh.*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
packages = ["alphamesh"]
# `mypy` and `mypy .` must mean the same thing: strict checking of the
# production package. Tests were never in the type gate (they use untyped
# pytest fixtures and rely on runtime asserts mypy cannot follow), so they are
# excluded from discovery rather than silently failing only one invocation.
explicit_package_bases = true
mypy_path = "."
exclude = ["^tests/", "^dashboard/", "^scripts/", "^\\.venv/"]
ignore_missing_imports = true
warn_unused_ignores = false
disallow_untyped_defs = true
no_implicit_optional = true
