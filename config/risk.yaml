# ---------------------------------------------------------------------------
# Risk Governor limits. These are HARD limits.
#
# Nothing in the AI reasoning path can read, write, widen or bypass this file.
# The Risk Governor loads it once at startup and treats it as immutable.
# ---------------------------------------------------------------------------

# Per-trade defined-loss caps, in US dollars.
max_defined_loss_per_trade: 500.0
# A trade may use the elevated cap only when judge confidence >= high_confidence_threshold.
high_confidence_max_defined_loss: 750.0
high_confidence_threshold: 0.75
# Absolute ceiling. No trade may ever exceed this, at any confidence.
absolute_max_defined_loss: 1000.0

# Portfolio-level caps.
max_open_positions: 5
max_portfolio_defined_risk: 4000.0

# Daily circuit breaker: realized + unrealized loss for the session, in dollars,
# expressed as a positive number. Breaching it halts all new entries.
daily_loss_circuit_breaker: 2000.0

# Correlated exposure. Symbols inside one group are treated as a single
# exposure bucket. Concurrency inside a cluster is constrained, not forbidden:
# at most 2 simultaneous positions and a capped defined-risk bucket per group,
# so a single correlated move cannot become the whole portfolio.
correlation_groups:
  index_beta: [SPY, QQQ, IWM, DIA]
  high_beta_semis: [NVDA, AMD]
  mega_high_beta: [TSLA, AAPL]
max_positions_per_correlation_group: 2
max_defined_risk_per_correlation_group: 1500.0

# Liquidity and quote quality gates.
max_quote_age_seconds: 120
max_relative_bid_ask_spread: 0.25   # (ask-bid) / mid
max_absolute_bid_ask_spread: 0.75   # dollars, per share
min_option_bid: 0.05
min_contract_day_volume: 25
min_top_of_book_size: 1

# Account gates.
min_buying_power_multiple: 2.0   # require buying power >= max_loss * this

# Strategy allowlist. Anything not listed is rejected as UNSUPPORTED_STRATEGY.
allowed_strategies:
  - BULL_CALL_SPREAD
  - BEAR_PUT_SPREAD
