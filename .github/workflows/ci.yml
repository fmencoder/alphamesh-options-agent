name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,dashboard]"

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy

      # The suite is hermetic: no Alpaca credentials, no Anthropic key and no
      # network access are required, so CI needs no secrets at all.
      - name: Tests
        run: pytest -q

      - name: Paper guard must block a live endpoint
        run: |
          set +e
          APCA_API_BASE_URL=https://api.alpaca.markets python -m alphamesh.main health
          code=$?
          set -e
          if [ "$code" -ne 2 ]; then
            echo "expected exit 2 from the paper guard, got $code"
            exit 1
          fi

      - name: Offline replay over the committed Alpaca capture
        env:
          ALPHAMESH_DATA_SOURCE: mcp_capture
          ALPHAMESH_DRY_RUN: "true"
          DATABASE_PATH: ./data/ci.db
        run: python -m alphamesh.main replay
